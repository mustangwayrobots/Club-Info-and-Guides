<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guides | Mustang Way Robots</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%2338bdf8' d='M13 2 4 14h6l-1 8 9-12h-6z'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>

  <!--
    ==========================================================================
    Mustang Way Robots - DOCUMENT LIBRARY page (reusable template)

    Drop this same index.html into any "document" repo (Club-Info-and-Guides,
    Instructor_Guides, ...). It works out which repo it is in from its own web
    address and shows a card for every document in the repo:
        .md  .pdf  .docx .doc  .pptx .ppt  .xlsx .xls  .txt .csv
        .png .jpg .jpeg .gif .webp  .mp4
    Markdown (.md) opens right here, nicely formatted, with a Print button.
    PDFs open in the browser. Word/PowerPoint/Excel open in Microsoft's free
    online viewer, with a Download button as backup.

    Folders become sections. Name a folder "01_Safety", "02_Schedules" etc.
    to control the order; the number is hidden on the page. Same for files.

    Not shown: index.html, README.md, LICENSE, and anything inside a folder
    named images, img, assets, or starting with "." or "_".
    (Put pictures used inside a guide in an "images" folder.)

    Only the PAGE settings block below ever needs editing.
    ==========================================================================
  -->

  <style>
    :root {
      --bg: #050b14; --card: #0c1524; --card-2: #101c30;
      --accent: #38bdf8; --accent-2: #0ea5e9; --warn: #fbbf24;
      --text: #f8fafc; --muted: #94a3b8; --dim: #64748b;
      --border: #1e293b; --border-2: #27364d; --max: 1200px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background:
        radial-gradient(ellipse 80% 45% at 50% -5%, rgba(56,189,248,.14), transparent 70%),
        linear-gradient(rgba(56,189,248,.035) 1px, transparent 1px) 0 0 / 32px 32px,
        linear-gradient(90deg, rgba(56,189,248,.035) 1px, transparent 1px) 0 0 / 32px 32px,
        var(--bg);
      color: var(--text); font-family: 'Inter', system-ui, sans-serif; line-height: 1.55; min-height: 100vh;
    }
    a { color: var(--accent); text-decoration: none; }
    .wrap { width: 100%; max-width: var(--max); margin: 0 auto; padding: 0 2rem; }

    .topbar { position: sticky; top: 0; z-index: 10; backdrop-filter: blur(10px); background: rgba(5,11,20,.8); border-bottom: 1px solid var(--border); }
    .topbar .wrap { display: flex; align-items: center; justify-content: space-between; height: 64px; gap: 1rem; }
    .brand { display: flex; align-items: center; gap: 10px; color: var(--text); }
    .logo { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: linear-gradient(135deg, rgba(56,189,248,.22), rgba(14,165,233,.06)); border: 1px solid rgba(56,189,248,.45); }
    .logo svg { width: 20px; height: 20px; }
    .brand-name { font-family: 'Orbitron', sans-serif; font-weight: 800; font-size: .95rem; letter-spacing: 1.5px; }

    .btn { display: inline-flex; align-items: center; gap: 8px; padding: .6rem 1rem; border-radius: 10px; font: inherit; font-weight: 600; font-size: .86rem; border: 1px solid var(--border-2); background: rgba(255,255,255,.02); color: var(--text); cursor: pointer; white-space: nowrap; transition: border-color .15s, transform .12s; }
    .btn:hover { border-color: var(--accent); transform: translateY(-1px); }
    .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #03121f; border-color: transparent; }
    .btn-sm { padding: .45rem .8rem; font-size: .8rem; }

    header.page { padding: 3rem 0 1.5rem; }
    .kicker { font-family: 'JetBrains Mono', monospace; font-size: .75rem; color: var(--accent); letter-spacing: 1px; text-transform: uppercase; }
    h1 { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 2.4rem; margin-top: .3rem; }
    .sub { color: var(--muted); margin-top: .5rem; max-width: 720px; }
    .notice { margin-top: 1.4rem; padding: 1rem 1.2rem; border-radius: 14px; border: 2px solid rgba(251,191,36,.5); background: rgba(251,191,36,.08); color: #fde68a; max-width: 900px; }

    .tools { display: flex; gap: .7rem; align-items: center; margin: 1rem 0 .5rem; }
    .search { display: flex; align-items: center; gap: 8px; width: 340px; background: var(--card); border: 1px solid var(--border-2); border-radius: 10px; padding: 0 .8rem; }
    .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(56,189,248,.15); }
    .search svg { width: 16px; height: 16px; stroke: var(--dim); flex: none; }
    .search input { background: transparent; border: 0; outline: 0; color: var(--text); font: inherit; font-size: .9rem; padding: .65rem 0; width: 100%; }

    .group { margin-top: 2rem; }
    .group h2 { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; font-weight: 800; color: var(--muted); margin-bottom: .9rem; letter-spacing: .5px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
    .card { display: flex; flex-direction: column; justify-content: space-between; gap: 1rem; padding: 1.3rem; border-radius: 16px; background: var(--card); border: 1px solid var(--border); transition: border-color .15s, transform .15s, box-shadow .15s; }
    .card:hover { border-color: var(--border-2); transform: translateY(-2px); box-shadow: 0 12px 30px rgba(0,0,0,.3); }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: .8rem; }
    .card-icon { width: 42px; height: 42px; border-radius: 10px; display: grid; place-items: center; font-size: 1.3rem; background: var(--card-2); border: 1px solid var(--border-2); flex: none; }
    .badge { font-family: 'JetBrains Mono', monospace; font-size: .66rem; letter-spacing: .5px; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--border-2); color: var(--muted); }
    .card-title { font-weight: 700; font-size: 1.02rem; margin-top: .9rem; }
    .card-desc { color: var(--muted); font-size: .87rem; margin-top: .35rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .card-actions { display: flex; gap: .5rem; flex-wrap: wrap; }

    .status { color: var(--muted); text-align: center; padding: 3rem 0; }
    .status.warn { color: var(--warn); }

    /* ---------- reader ---------- */
    #reader { display: none; padding: 2rem 0 3rem; }
    .reader-bar { display: flex; justify-content: space-between; gap: .6rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .reader-bar .right { display: flex; gap: .5rem; }
    .doc { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 2.6rem 3rem; max-width: 920px; margin: 0 auto; }
    .doc h1, .doc h2, .doc h3, .doc h4 { font-family: 'Orbitron', sans-serif; color: var(--accent); margin: 1.6rem 0 .8rem; line-height: 1.25; }
    .doc h1 { font-size: 1.8rem; margin-top: 0; border-bottom: 1px solid var(--border); padding-bottom: .6rem; }
    .doc h2 { font-size: 1.3rem; } .doc h3 { font-size: 1.08rem; } .doc h4 { font-size: 1rem; }
    .doc p, .doc li { color: #e2e8f0; }
    .doc p { margin-bottom: 1rem; }
    .doc ul, .doc ol { margin: 0 0 1rem 1.5rem; }
    .doc li { margin-bottom: .35rem; }
    .doc li > ul, .doc li > ol { margin-top: .35rem; margin-bottom: .2rem; }
    .doc strong { color: #fff; }
    .doc hr { border: 0; border-top: 1px solid var(--border); margin: 1.8rem 0; }
    .doc img { max-width: 100%; border-radius: 10px; margin: .5rem 0; }
    .doc code { background: #030710; color: var(--accent); padding: .15rem .4rem; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: .88em; }
    .doc pre { margin-bottom: 1rem; }
    .doc pre code { display: block; padding: 1rem; overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; color: #e2e8f0; }
    .doc blockquote { border-left: 4px solid var(--warn); background: rgba(251,191,36,.07); padding: .8rem 1rem; margin: 1rem 0; border-radius: 0 8px 8px 0; }
    .doc blockquote p { margin: 0; }
    .doc table { border-collapse: collapse; width: 100%; margin-bottom: 1rem; font-size: .92rem; }
    .doc th, .doc td { border: 1px solid var(--border-2); padding: .5rem .7rem; text-align: left; vertical-align: top; }
    .doc th { background: var(--card-2); }
    .doc input[type=checkbox] { margin-right: .4rem; }

    footer { border-top: 1px solid var(--border); margin-top: 3rem; padding: 2rem 0 2.5rem; color: var(--dim); font-size: .85rem; }
    footer a { color: var(--muted); }

    @media (max-width: 1000px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } .wrap { padding: 0 1rem; } .doc { padding: 1.5rem; } .search { width: 100%; } }

    /* Printing a guide gives clean black-on-white pages (good for sign-off forms) */
    @media print {
      body { background: #fff; color: #000; }
      .topbar, .reader-bar, footer, header.page, #library { display: none !important; }
      #reader { display: block !important; padding: 0; }
      .doc { border: 0; padding: 0; max-width: none; background: #fff; }
      .doc h1, .doc h2, .doc h3, .doc h4 { color: #000; }
      .doc p, .doc li, .doc strong { color: #000; }
      .doc code { background: #eee; color: #000; }
      .doc blockquote { background: #f3f3f3; border-left-color: #999; }
      .doc th { background: #eee; }
      .doc th, .doc td { border-color: #999; }
      .doc a { color: #000; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="https://mustangwayrobots.github.io/">
        <span class="logo"><svg viewBox="0 0 24 24"><path fill="#38bdf8" d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg></span>
        <span class="brand-name">MUSTANG WAY ROBOTS</span>
      </a>
      <a class="btn btn-sm" href="https://mustangwayrobots.github.io/">← Main page</a>
    </div>
  </header>

  <main class="wrap">
    <!-- ================= LIBRARY ================= -->
    <div id="library">
      <header class="page">
        <div class="kicker" id="page-kicker">Document library</div>
        <h1 id="page-title">Guides</h1>
        <p class="sub" id="page-sub"></p>
        <div class="notice" id="page-notice" hidden></div>
      </header>

      <div class="tools">
        <label class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search" type="search" placeholder="Search documents…" autocomplete="off" />
        </label>
      </div>

      <div id="groups"></div>
      <div id="status" class="status">Loading documents…</div>
    </div>

    <!-- ================= READER (Markdown) ================= -->
    <div id="reader">
      <div class="reader-bar">
        <button class="btn" onclick="closeDoc()">← All documents</button>
        <div class="right">
          <button class="btn" onclick="window.print()">🖨️ Print</button>
          <a class="btn" id="reader-github" href="#" target="_blank" rel="noopener">View on GitHub</a>
        </div>
      </div>
      <article class="doc" id="doc-body"></article>
    </div>
  </main>

  <footer>
    <div class="wrap">© <span id="year"></span> Mustang Way Robots · Downers Grove South High School</div>
  </footer>

  <script>
    // =========================================================================
    // PAGE settings: the only part to edit when copying this page to a new repo.
    // Leave a value as '' to use the automatic default.
    // =========================================================================
    const PAGE = {
      // Pick the settings for this repo by its name (lower case). Anything not
      // listed here gets the defaults: title made from the repo name.
      'club-info-and-guides': {
        kicker: 'Required reading · every member',
        title: 'Club Info & Guidelines',
        subtitle: 'Club rules, safety procedures, schedules and forms. Every member must read these before working on a project.',
        notice: '⚠️ Read every document on this page. Forms marked "Acknowledgment" must be printed, signed by you and a parent/guardian, and handed to the club advisor.'
      },
      'instructor_guides': {
        kicker: 'Instructors',
        title: 'Instructor Guides',
        subtitle: 'How-to guides and templates for teachers running Mustang Way Robots projects.',
        notice: ''
      }
    };

    // =========================================================================
    // Settings (normally no need to change)
    // =========================================================================
    const ORG = 'mustangwayrobots';
    const FALLBACK_REPO = 'Club-Info-and-Guides';   // used when the page is opened outside GitHub Pages
    const CACHE_MINUTES = 15;
    const SKIP_FILES = ['index.html', 'readme.md', 'license', 'license.md', '404.html'];
    const SKIP_FOLDERS = ['images', 'img', 'assets'];

    const TYPES = {
      md:   { icon: '📄', label: 'GUIDE',  kind: 'md' },
      pdf:  { icon: '📕', label: 'PDF',    kind: 'pdf' },
      docx: { icon: '📘', label: 'WORD',   kind: 'office' }, doc: { icon: '📘', label: 'WORD', kind: 'office' },
      pptx: { icon: '📙', label: 'SLIDES', kind: 'office' }, ppt: { icon: '📙', label: 'SLIDES', kind: 'office' },
      xlsx: { icon: '📗', label: 'SHEET',  kind: 'office' }, xls: { icon: '📗', label: 'SHEET', kind: 'office' },
      txt:  { icon: '📝', label: 'TEXT',   kind: 'open' },  csv: { icon: '📊', label: 'CSV', kind: 'open' },
      png:  { icon: '🖼️', label: 'IMAGE',  kind: 'open' },  jpg: { icon: '🖼️', label: 'IMAGE', kind: 'open' },
      jpeg: { icon: '🖼️', label: 'IMAGE',  kind: 'open' },  gif: { icon: '🖼️', label: 'IMAGE', kind: 'open' },
      webp: { icon: '🖼️', label: 'IMAGE',  kind: 'open' },  mp4: { icon: '🎬', label: 'VIDEO', kind: 'open' }
    };

    // =========================================================================
    // Helpers
    // =========================================================================
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const onPages = location.hostname.endsWith('github.io') && location.pathname.split('/')[1];
    const REPO = onPages ? decodeURIComponent(location.pathname.split('/')[1]) : FALLBACK_REPO;
    const encPath = (p) => p.split('/').map(encodeURIComponent).join('/');
    const pagesFile = (p) => `https://${ORG}.github.io/${REPO}/${encPath(p)}`;
    const rawFile = (p) => `https://raw.githubusercontent.com/${ORG}/${REPO}/HEAD/${encPath(p)}`;
    const githubFile = (p) => `https://github.com/${ORG}/${REPO}/blob/HEAD/${encPath(p)}`;
    const ext = (p) => (p.split('.').pop() || '').toLowerCase();
    // "01_battery_safety-policy.md" -> "Battery Safety Policy"
    const SMALL_WORDS = ['a', 'an', 'and', 'as', 'at', 'for', 'in', 'of', 'on', 'or', 'the', 'to', 'with'];
    const niceName = (s) => s.replace(/\.[^.]+$/, '').replace(/^\d+[\s._-]*/, '').replace(/[_-]+/g, ' ').trim()
                              .split(/\s+/).map((w, i) => (i > 0 && SMALL_WORDS.includes(w.toLowerCase()))
                                ? w.toLowerCase() : (/^\d+d$/i.test(w) ? w.toUpperCase() : w.charAt(0).toUpperCase() + w.slice(1)))
                              .join(' ');

    function readCache(key) { try { return JSON.parse(localStorage.getItem(key)); } catch { return null; } }
    function writeCache(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch { /* ignore */ } }

    // =========================================================================
    // Load the file list (one GitHub request, cached)
    // =========================================================================
    async function loadFiles() {
      const key = `mwr-docs-${REPO.toLowerCase()}`;
      const cached = readCache(key);
      if (cached && Date.now() - cached.time < CACHE_MINUTES * 60000) return { files: cached.files, stale: false };
      try {
        const res = await fetch(`https://api.github.com/repos/${ORG}/${REPO}/git/trees/HEAD?recursive=1`,
                                { headers: { 'Accept': 'application/vnd.github+json' } });
        if (!res.ok) throw new Error(`GitHub answered ${res.status}`);
        const data = await res.json();
        const files = data.tree.filter(t => t.type === 'blob').map(t => t.path).filter(p => {
          const parts = p.split('/');
          const name = parts[parts.length - 1].toLowerCase();
          const folders = parts.slice(0, -1).map(f => f.toLowerCase());
          if (SKIP_FILES.includes(name) || name.startsWith('.') || name.startsWith('_')) return false;
          if (folders.some(f => f.startsWith('.') || f.startsWith('_') || SKIP_FOLDERS.includes(f))) return false;
          return ext(p) in TYPES;
        });
        writeCache(key, { time: Date.now(), files });
        return { files, stale: false };
      } catch (err) {
        console.error(err);
        if (cached) return { files: cached.files, stale: true };
        throw err;
      }
    }

    // First real paragraph of a Markdown file, used as the card description
    async function mdSummary(path) {
      const key = `mwr-sum-${REPO.toLowerCase()}-${path}`;
      const cached = readCache(key);
      if (cached && Date.now() - cached.time < CACHE_MINUTES * 60000) return cached.text;
      try {
        const res = await fetch(rawFile(path));
        if (!res.ok) return '';
        const lines = (await res.text()).split('\n').map(l => l.trim());
        const line = lines.find(l => l && !/^(#|\||>|-{3,}|\*\*document|!\[|<|\*\*[^*]+\*\*$)/i.test(l)) || '';
        const text = line.replace(/[*_`#>\[\]]/g, '').replace(/\(http[^)]*\)/g, '').slice(0, 220);
        writeCache(key, { time: Date.now(), text });
        return text;
      } catch { return ''; }
    }

    // =========================================================================
    // Library view
    // =========================================================================
    let allFiles = [];

    function card(path) {
      const t = TYPES[ext(path)];
      const name = niceName(path.split('/').pop());
      let actions = '';
      if (t.kind === 'md') {
        actions = `<a class="btn btn-primary btn-sm" href="#doc=${encodeURIComponent(path)}">Read</a>`;
      } else if (t.kind === 'pdf' || t.kind === 'open') {
        actions = `<a class="btn btn-primary btn-sm" href="${pagesFile(path)}" target="_blank" rel="noopener">Open</a>
                   <a class="btn btn-sm" href="${pagesFile(path)}" download>Download</a>`;
      } else {
        const viewer = `https://view.officeapps.live.com/op/view.aspx?src=${encodeURIComponent(pagesFile(path))}`;
        actions = `<a class="btn btn-primary btn-sm" href="${viewer}" target="_blank" rel="noopener">Open</a>
                   <a class="btn btn-sm" href="${pagesFile(path)}" download>Download</a>`;
      }
      const defaultDesc = { md: 'Guide', pdf: 'PDF document', office: `${t.label[0] + t.label.slice(1).toLowerCase()} file`, open: 'File' }[t.kind];
      return `
        <article class="card">
          <div>
            <div class="card-top"><div class="card-icon">${t.icon}</div><span class="badge">${t.label}</span></div>
            <div class="card-title">${esc(name)}</div>
            <div class="card-desc" data-sum="${t.kind === 'md' ? esc(path) : ''}">${esc(defaultDesc)}</div>
          </div>
          <div class="card-actions">${actions}</div>
        </article>`;
    }

    function renderLibrary() {
      const q = $('search').value.trim().toLowerCase();
      const list = allFiles.filter(p => !q || niceName(p).toLowerCase().includes(q) || p.toLowerCase().includes(q));

      // Group by top folder. Root files come first under "General".
      const groups = new Map();
      list.forEach(p => {
        const parts = p.split('/');
        const g = parts.length > 1 ? parts[0] : '';
        if (!groups.has(g)) groups.set(g, []);
        groups.get(g).push(p);
      });
      const order = [...groups.keys()].sort((a, b) => (a === '') ? -1 : (b === '') ? 1 : a.localeCompare(b, undefined, { numeric: true }));
      const showHeadings = order.length > 1 || order[0] !== '';

      $('groups').innerHTML = order.map(g => {
        const files = groups.get(g).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
        return `<div class="group">
            ${showHeadings ? `<h2>${esc(g ? niceName(g) : 'General')}</h2>` : ''}
            <div class="grid">${files.map(card).join('')}</div>
          </div>`;
      }).join('');

      const s = $('status');
      s.className = 'status';
      s.hidden = list.length > 0;
      if (!list.length) s.textContent = allFiles.length ? 'No documents match your search.' : 'No documents here yet.';

      // Fill in Markdown descriptions
      document.querySelectorAll('[data-sum]').forEach(async el => {
        const path = el.dataset.sum;
        if (!path) return;
        const text = await mdSummary(path);
        if (text) el.textContent = text;
      });
    }

    // =========================================================================
    // Reader view (Markdown). The address is #doc=<path> so a teacher can
    // send students a link straight to one document.
    // =========================================================================
    async function openDoc(path) {
      $('library').style.display = 'none';
      $('reader').style.display = 'block';
      $('reader-github').href = githubFile(path);
      $('doc-body').innerHTML = '<p style="color:var(--muted)">Loading…</p>';
      document.title = `${niceName(path.split('/').pop())} | Mustang Way Robots`;
      window.scrollTo(0, 0);
      try {
        const res = await fetch(rawFile(path));
        if (!res.ok) throw new Error(res.status);
        const md = await res.text();
        const folder = path.includes('/') ? path.slice(0, path.lastIndexOf('/') + 1) : '';
        const html = DOMPurify.sanitize(marked.parse(md, { gfm: true }));
        const body = $('doc-body');
        body.innerHTML = html;
        // Make pictures and links that point at other files in the repo work
        body.querySelectorAll('img[src]').forEach(img => {
          const src = img.getAttribute('src');
          if (!/^(https?:|data:|\/)/i.test(src)) img.src = rawFile(folder + src.replace(/^\.\//, ''));
        });
        body.querySelectorAll('a[href]').forEach(a => {
          const href = a.getAttribute('href');
          if (/^(https?:|mailto:|#)/i.test(href)) { if (/^https?:/i.test(href)) { a.target = '_blank'; a.rel = 'noopener'; } return; }
          const target = (folder + href.replace(/^\.\//, '')).split('#')[0];
          a.href = ext(target) === 'md' ? `#doc=${encodeURIComponent(target)}` : pagesFile(target);
        });
      } catch (err) {
        console.error(err);
        $('doc-body').innerHTML = `<p style="color:var(--warn)">Couldn't load this document. Try again in a minute, or <a href="${githubFile(path)}" target="_blank" rel="noopener">open it on GitHub</a>.</p>`;
      }
    }

    function closeDoc() {
      history.pushState('', document.title, location.pathname + location.search);
      route();
    }

    function route() {
      const m = location.hash.match(/^#doc=(.+)$/);
      if (m) { openDoc(decodeURIComponent(m[1])); return; }
      $('reader').style.display = 'none';
      $('library').style.display = 'block';
      document.title = `${$('page-title').textContent} | Mustang Way Robots`;
    }

    // =========================================================================
    // Start
    // =========================================================================
    async function start() {
      $('year').textContent = new Date().getFullYear();
      const cfg = PAGE[REPO.toLowerCase()] || {};
      $('page-kicker').textContent = cfg.kicker || 'Document library';
      $('page-title').textContent = cfg.title || niceName(REPO);
      $('page-sub').textContent = cfg.subtitle || '';
      if (cfg.notice) { $('page-notice').hidden = false; $('page-notice').textContent = cfg.notice; }

      $('search').addEventListener('input', renderLibrary);
      window.addEventListener('hashchange', route);
      route();

      try {
        const { files, stale } = await loadFiles();
        allFiles = files;
        renderLibrary();
        if (stale) {
          const s = $('status');
          s.hidden = false; s.className = 'status warn';
          s.textContent = 'GitHub is busy right now, so this is the last saved list. Refresh in a few minutes for the newest.';
        }
      } catch {
        const s = $('status');
        s.className = 'status warn';
        s.innerHTML = `Couldn't load the document list from GitHub right now. Try again in a few minutes, or browse <a href="https://github.com/${ORG}/${REPO}">the files on GitHub</a>.`;
      }
    }

    start();
  </script>
</body>
</html>
