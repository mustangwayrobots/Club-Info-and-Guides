<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Club Info & Guidelines | Mustang Way Robots</title>
  
  <!-- Orbitron & Inter Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Marked.js for parsing Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --bg-dark: #050b14;
      --card-bg: #0c1524;
      --accent-blue: #38bdf8;
      --accent-hover: #0284c7;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #1e293b;
      --btn-secondary-bg: #1e293b;
      --btn-secondary-hover: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.08) 0%, transparent 60%),
        linear-gradient(to bottom, #050b14 0%, #030710 100%);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
      max-width: 800px;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.5rem;
      font-weight: 900;
      color: var(--accent-blue);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
      text-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
      font-weight: 400;
      margin-bottom: 1.5rem;
    }

    /* Top Navigation bar back to main portal */
    .nav-bar {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      font-weight: 800;
      text-decoration: none;
      background-color: var(--btn-secondary-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      background-color: var(--accent-blue);
      color: var(--bg-dark);
      border-color: var(--accent-blue);
    }

    .container {
      width: 100%;
      max-width: 1200px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1.5rem;
    }

    /* Card Styling */
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.75rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--border-color), transparent);
      transition: background 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: var(--accent-blue);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5), 0 0 20px var(--accent-glow);
    }

    .card:hover::before {
      background: linear-gradient(90deg, transparent, var(--accent-blue), transparent);
    }

    .card-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 0.75rem;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-description {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }

    .card-action {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--accent-blue);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Markdown Reader View Container */
    #reader-view {
      display: none;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 2.5rem;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      box-shadow: 0 12px 40px rgba(0,0,0,0.6);
    }

    /* Rendered Markdown Styling */
    .markdown-content h1, .markdown-content h2, .markdown-content h3 {
      font-family: 'Orbitron', sans-serif;
      color: var(--accent-blue);
      margin-top: 1.5rem;
      margin-bottom: 1rem;
    }

    .markdown-content h1 { font-size: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem; }
    .markdown-content h2 { font-size: 1.5rem; }
    .markdown-content h3 { font-size: 1.2rem; }

    .markdown-content p {
      color: var(--text-main);
      line-height: 1.7;
      margin-bottom: 1rem;
    }

    .markdown-content ul, .markdown-content ol {
      margin-left: 1.5rem;
      margin-bottom: 1rem;
      color: var(--text-main);
    }

    .markdown-content li {
      margin-bottom: 0.5rem;
      line-height: 1.5;
    }

    .markdown-content code {
      background-color: #030710;
      color: #38bdf8;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.9em;
    }

    .markdown-content pre code {
      display: block;
      padding: 1rem;
      overflow-x: auto;
      border: 1px solid var(--border-color);
      border-radius: 8px;
    }

    .markdown-content blockquote {
      border-left: 4px solid var(--accent-blue);
      padding-left: 1rem;
      margin: 1rem 0;
      color: var(--text-muted);
      font-style: italic;
    }

    .status-msg {
      text-align: center;
      font-family: 'Orbitron', sans-serif;
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-top: 4rem;
    }

    footer {
      margin-top: auto;
      padding-top: 4rem;
      color: var(--text-muted);
      font-size: 0.85rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>Club Info & Guidelines</h1>
    <p class="subtitle">Operations, Schedules & Teacher Onboarding Hub</p>
  </header>

  <div class="nav-bar">
    <a href="https://mustangwayrobots.github.io/" class="back-btn">
      ← Back to Main Portal
    </a>
    <div id="reader-nav" style="display: none;">
      <button onclick="showGridView()" class="back-btn" style="cursor: pointer;">
        ← Back to Guides
      </button>
    </div>
  </div>

  <main class="container">
    <!-- Grid View of Markdown Files -->
    <div id="grid-view">
      <div id="guides-grid" class="grid"></div>
      <div id="status" class="status-msg">Scanning guides and documentation...</div>
    </div>

    <!-- Markdown Content Reader View -->
    <div id="reader-view">
      <div id="markdown-body" class="markdown-content"></div>
    </div>
  </main>

  <footer>
    &copy; Mustang Way Robots • Downers Grove South High School
  </footer>

  <script>
    const GITHUB_USERNAME = 'mustangwayrobots';
    const REPO_NAME = 'Club-Info-and-Guides';

    async function loadGuides() {
      const grid = document.getElementById('guides-grid');
      const status = document.getElementById('status');

      try {
        const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents`, {
          headers: { 'Accept': 'application/vnd.github.v3+json' }
        });

        if (!response.ok) throw new Error('Failed to load repository contents');

        const files = await response.json();

        // Filter for Markdown files (.md), excluding LICENSE if present
        const mdFiles = files.filter(file => file.type === 'file' && file.name.toLowerCase().endsWith('.md'));

        if (mdFiles.length === 0) {
          status.textContent = 'No guide documents found yet.';
          return;
        }

        status.style.display = 'none';
        grid.innerHTML = '';

        mdFiles.forEach(file => {
          const card = document.createElement('div');
          card.className = 'card';

          // Clean up file name for display (e.g., "teacher-guide-firmware.md" -> "Teacher Guide Firmware")
          const cleanName = file.name
            .replace(/\.md$/i, '')
            .replace(/[-_]/g, ' ');

          // Choose an icon based on name
          let icon = '📖';
          const lowerName = file.name.toLowerCase();
          if (lowerName.includes('firmware') || lowerName.includes('code')) icon = '⚡';
          if (lowerName.includes('3d') || lowerName.includes('print')) icon = '🖨️';
          if (lowerName.includes('schedule') || lowerName.includes('info')) icon = '📅';

          card.innerHTML = `
            <div>
              <div class="card-title">${icon} ${cleanName}</div>
              <div class="card-description">Click to open and read documentation details.</div>
            </div>
            <div class="card-action">Read Guide →</div>
          `;

          card.onclick = () => loadMarkdownFile(file.download_url, cleanName);
          grid.appendChild(card);
        });

      } catch (err) {
        console.error(err);
        status.textContent = 'Unable to load guides at this time.';
      }
    }

    async function loadMarkdownFile(downloadUrl, title) {
      const gridView = document.getElementById('grid-view');
      const readerView = document.getElementById('reader-view');
      const readerNav = document.getElementById('reader-nav');
      const markdownBody = document.getElementById('markdown-body');

      gridView.style.display = 'none';
      readerView.style.display = 'block';
      readerNav.style.display = 'block';
      markdownBody.innerHTML = '<p style="text-align: center; color: var(--text-muted);">Loading document...</p>';

      window.scrollTo({ top: 0, behavior: 'smooth' });

      try {
        const response = await fetch(downloadUrl);
        if (!response.ok) throw new Error('Failed to fetch markdown file');
        
        const markdownText = await response.text();
        markdownBody.innerHTML = marked.parse(markdownText);
      } catch (err) {
        console.error(err);
        markdownBody.innerHTML = '<p style="color: #ef4444;">Failed to load document content.</p>';
      }
    }

    function showGridView() {
      document.getElementById('reader-view').style.display = 'none';
      document.getElementById('reader-nav').style.display = 'none';
      document.getElementById('grid-view').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    loadGuides();
  </script>
</body>
</html>
